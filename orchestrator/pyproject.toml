[project]
name = "accfarm-orchestrator"
version = "0.1.0"
description = "The Orchestrator layer of AccFarm v2 - the brain that schedules and manages account jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.4.0",
    "apscheduler>=3.10.4",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "websockets>=13.0",
    "accfarm-shared",
    "accfarm-device",
    "accfarm-ig",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
